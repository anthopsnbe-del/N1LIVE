<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Plantation — aperçu local</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="assets/plantation/plantation.css">
<style>body{margin:0;background:#141d16;padding:24px;font-family:system-ui,sans-serif}</style>
</head><body>
<!-- Aperçu de développement : ouvre ce fichier via un petit serveur local
     (par exemple `php -S localhost:8000`) pour tester le jeu sans base de données.
     La vue est chargée depuis plantation_view.php : cet aperçu ne peut donc pas
     se désynchroniser du vrai gabarit. La sauvegarde utilisée est locale
     (localStorage) et n'a aucun lien avec les comptes joueurs. -->
<div id="gpHost"></div>
<script>
(async () => {
  const [view, catalog] = await Promise.all([
    fetch('plantation_view.php').then(r => r.text()),
    fetch('assets/plantation/catalog.json').then(r => r.json()),
  ]);
  document.getElementById('gpHost').innerHTML = view;
  window.GP_CONFIG = {demo: true, assetBase: 'assets/plantation/', endpoint: '', csrf: '', catalog};
  for (const src of ['three.min.js', 'models.js', 'demo.js', 'plantation.js']) {
    await new Promise(resolve => {
      const el = document.createElement('script');
      el.src = 'assets/plantation/' + src;
      el.onload = resolve;
      el.onerror = resolve;
      document.body.append(el);
    });
  }
})();
</script>
</body></html>
