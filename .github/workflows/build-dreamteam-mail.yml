name: Build DreamTeam Mail (.exe)

on:
  push:
    paths:
      - "dreamteam-mail/**"
      - ".github/workflows/build-dreamteam-mail.yml"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests unitaires
        working-directory: dreamteam-mail
        run: python -m unittest discover -s tests -v

  exe:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependances de build
        working-directory: dreamteam-mail
        run: python -m pip install -r requirements-build.txt
      - name: Verification de l'interface graphique
        working-directory: dreamteam-mail
        run: python -c "import dreamteam_mail.gui; print('GUI OK')"
      - name: Icone de l'application
        working-directory: dreamteam-mail
        run: python tools/creer_ico.py
      - name: Compilation PyInstaller
        working-directory: dreamteam-mail
        run: python -m PyInstaller --clean --noconfirm DreamTeamMail.spec
      - name: Publication de l'executable
        uses: actions/upload-artifact@v4
        with:
          name: DreamTeamMail-exe
          path: dreamteam-mail/dist/DreamTeamMail.exe
          if-no-files-found: error
